<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>终端用户飞书对话通道 · OpenClaw on Agent Substrate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#eef1f6;--panel:#fff;--line:#e3e7ef;--text:#1f2329;--muted:#8f959e;--blue:#3370ff;--green:#00b42a;--yellow:#ff8800;--cyan:#14c0ff;--red:#f53f3f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,"PingFang SC","Noto Sans SC",Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#fff;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0}header .sub{color:var(--muted);font-size:12px}
header .right{margin-left:auto;display:flex;gap:8px;align-items:center}
input,button{font:inherit}input{border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}button.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;padding:16px 20px}
.chat{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;height:calc(100vh - 110px);min-height:520px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.chead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.chead .name{font-weight:600}.chead .meta{font-size:11px;color:var(--muted)}
.status{margin-top:6px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px;background:#fafbfc}
.pill{display:inline-flex;gap:6px;align-items:center;padding:2px 10px;border-radius:999px;font-weight:600;font-size:12px}
.p-RUNNING{background:#e8ffea;color:var(--green)}.p-RESUMING{background:#e8f7ff;color:#0e99d6}.p-SUSPENDING{background:#fff3e8;color:var(--yellow)}
.p-SUSPENDED{background:#f2f3f5;color:var(--muted)}.p-CRASHED{background:#ffece8;color:var(--red)}.p-NONE{background:#f2f3f5;color:var(--muted)}
.bar{height:4px;background:#eee;border-radius:3px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:var(--yellow);transition:width .5s linear}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#f5f6f7}
.m{max-width:82%;padding:8px 12px;border-radius:10px;white-space:pre-wrap;word-break:break-word}
.m.user{align-self:flex-end;background:#cce0ff}.m.assistant{align-self:flex-start;background:#fff;border:1px solid var(--line)}
.m.system{align-self:center;background:#ffece8;color:var(--red);font-size:12px}
.m .t{display:block;font-size:10px;color:var(--muted);margin-top:4px}
.sys{align-self:center;font-size:11px;color:var(--muted);background:#eceef2;border-radius:999px;padding:2px 10px}
.typing{align-self:flex-start;color:var(--muted);font-size:12px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.composer input{flex:1}
.empty{padding:60px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div>
    <h1>💬 终端用户飞书对话通道</h1>
    <div class="sub">每个飞书用户拥有一个独立的 OpenClaw Actor（gVisor 沙箱 + 独立 Filestore 卷）。空闲后自动休眠，再次发消息自动唤醒。</div>
  </div>
  <div class="right">
    <input id="newUser" placeholder="模拟用户名，如 李雷" size="14">
    <button class="ghost" onclick="addSim()">＋ 添加 Web 模拟用户</button>
  </div>
</header>
<div class="wrap" id="wrap"><div class="empty">等待飞书用户发来第一条消息…</div></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clock=t=>new Date(t).toLocaleTimeString("zh-CN",{hour12:false});
const colors=["#3370ff","#00b42a","#ff7d00","#7816ff","#f53f3f","#14c9c9","#eb2f96"];
const color=s=>colors[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%colors.length];
const sims=JSON.parse(localStorage.getItem("sims")||"[]");
const pending={};const drafts={};let last=null;
function addSim(){const n=$("newUser").value.trim();if(!n)return;if(!sims.includes(n))sims.push(n);localStorage.setItem("sims",JSON.stringify(sims));$("newUser").value="";render(last)}
async function send(user,display){
  const box=$("in-"+key(user));const text=box.value.trim();if(!text)return;box.value="";drafts[key(user)]="";
  pending[user]={text,at:Date.now()};render(last);
  try{const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({user,text,displayName:display})});
    const d=await r.json();if(!d.ok)alert("发送失败："+(d.error||r.status));}catch(e){alert(e.message)}
  delete pending[user];refresh();
}
const key=s=>String(s).replace(/[^A-Za-z0-9_-]/g,c=>"_"+c.charCodeAt(0));
function statusLine(d,c,a){
  const idle=(d.observer?.idleTimeoutSeconds||0)*1000;
  const st=a?.status||"NONE";
  const label={RUNNING:"🟢 运行中",RESUMING:"⚡ 正在唤醒：挂载 Filestore 卷 + 恢复快照",SUSPENDING:"🟡 正在休眠：保存快照 + 卸载存储",SUSPENDED:"💤 已休眠（快照在 GCS，存储已卸载，不占计算资源）",CRASHED:"🔴 已崩溃",NONE:"⚪ 尚未创建（发送第一条消息时自动创建）"}[st]||st;
  let detail="";
  if(a){
    const v=a.volumes?.[0];
    detail=`<div style="margin-top:4px;color:var(--muted)">Actor <code>${esc(a.name)}</code>${a.workerPod?` · Worker <code>${esc(a.workerPod)}</code>`:""}`+
      `${v&&v.provisioned?` · 卷 ${a.attached?"🔗 已挂载":"🔌 已卸载"}`:""}${a.snapshot?` · 快照 Gen#${a.snapshot.generation}`:""}</div>`;
  }
  let bar="";
  if(c&&st==="RUNNING"&&idle){
    if(c.inflight>0) bar=`<div style="margin-top:4px;color:var(--muted)">对话进行中…</div>`;
    else{const left=Math.max(0,idle-(d.now-c.lastActivity));bar=`<div style="margin-top:4px;color:var(--muted)">⏱️ ${Math.ceil(left/1000)}s 后自动休眠</div><div class="bar"><i style="width:${100*left/idle}%"></i></div>`;}
  }
  return `<span class="pill p-${st}">${label}</span>${detail}${bar}`;
}
function render(d){
  if(!d)return;
  const convs=[...(d.observer?.conversations||[])];
  for(const s of sims){const sk=`web:direct:${s.replace(/[^A-Za-z0-9_-]/g,"_")}`;if(!convs.find(c=>c.sessionKey===sk))convs.push({sessionKey:sk,displayName:s,peer:s,channel:"web",messages:[],sim:true,actor:null})}
  if(!convs.length){$("wrap").innerHTML='<div class="empty">等待飞书用户发来第一条消息…（也可以在右上角添加 Web 模拟用户）</div>';return}
  // Preserve composer drafts / focus across re-renders.
  const focus=document.activeElement?.id;
  document.querySelectorAll(".composer input").forEach(i=>drafts[i.id.slice(3)]=i.value);
  const scroll={};document.querySelectorAll(".msgs").forEach(m=>scroll[m.id]=m.scrollHeight-m.scrollTop-m.clientHeight<30);
  convs.sort((x,y)=>(y.lastActivity||0)-(x.lastActivity||0));
  $("wrap").innerHTML=convs.map(c=>{
    const isWeb=c.channel==="web"||c.sim;
    const user=isWeb?(c.displayName||c.peer):(c.displayName||c.peer);
    const simUser=isWeb?(c.sessionKey.replace(/^web:direct:/,"")):null;
    const a=(d.actors||[]).find(x=>x.name===c.actor);
    const id=key(c.sessionKey);
    const msgs=(c.messages||[]).map(m=>{
      if(m.role==="user")return `<div class="m user">${esc(m.text)}<span class="t">${clock(m.at)}</span></div>`;
      if(m.role==="system")return `<div class="m system">${esc(m.text)}</div>`;
      const lat=m.firstByteMs!=null?` · 首字 ${(m.firstByteMs/1000).toFixed(1)}s · 总计 ${(m.latencyMs/1000).toFixed(1)}s`:"";
      return `<div class="m assistant">${esc(m.text||"（空回复）")}<span class="t">🤖 Ada · ${clock(m.at)}${lat}</span></div>`;
    }).join("");
    const p=simUser&&pending[simUser]?`<div class="m user">${esc(pending[simUser].text)}<span class="t">发送中…</span></div>`:"";
    const typing=(c.inflight>0||p)?`<div class="typing">Ada 正在思考…${a?.status==="RESUMING"?"（正在从快照唤醒沙箱）":""}</div>`:"";
    return `<div class="chat"><div class="chead"><div class="avatar" style="background:${color(user)}">${esc(String(user).slice(0,1).toUpperCase())}</div>
      <div><div class="name">${esc(user)}</div><div class="meta">${isWeb?"Web 模拟用户":"飞书用户 · "+esc(c.peer)} · ${c.turns||0} 轮对话</div></div></div>
      <div class="status">${statusLine(d,c,a)}</div>
      <div class="msgs" id="msgs-${id}">${msgs||'<div class="sys">暂无消息</div>'}${p}${typing}</div>
      ${isWeb?`<div class="composer"><input id="in-${key(simUser)}" placeholder="以 ${esc(user)} 的身份发消息…" onkeydown="if(event.key==='Enter')send('${esc(simUser)}','${esc(user)}')"><button onclick="send('${esc(simUser)}','${esc(user)}')">发送</button></div>`
        :`<div class="composer" style="color:var(--muted);font-size:12px;justify-content:center">该用户通过飞书客户端对话（此处为实时镜像）</div>`}</div>`;
  }).join("");
  document.querySelectorAll(".composer input").forEach(i=>{const k=i.id.slice(3);if(drafts[k])i.value=drafts[k]});
  if(focus&&$(focus)){const el=$(focus);el.focus();el.setSelectionRange(el.value.length,el.value.length)}
  document.querySelectorAll(".msgs").forEach(m=>{if(scroll[m.id]!==false)m.scrollTop=m.scrollHeight});
}
async function refresh(){try{last=await (await fetch("/api/state")).json();render(last)}catch(e){}}
setInterval(refresh,1500);refresh();
</script>
</body>
</html>
