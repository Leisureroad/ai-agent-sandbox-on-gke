steps:
- name: gcr.io/cloud-builders/docker
  args: ["build", "-f", "build/actor.Dockerfile", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/openclaw-actor:${_TAG}", "."]
images: ["${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/openclaw-actor:${_TAG}"]
substitutions:
  # Image repo = ${_REGION}-docker.pkg.dev/<build project>/${_AR_REPO}; override with
  # --substitutions=_REGION=<region>,_AR_REPO=<repo>
  _REGION: us-central1
  _AR_REPO: ate-images
  _TAG: demo
